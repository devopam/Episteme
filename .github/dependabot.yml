# Dependabot: weekly version updates (Monday 06:00 UTC), minor and patch bumps grouped
# into one pull request per ecosystem, each major bump in its own pull request, and
# security updates grouped as `security-fixes`. The dependabot-auto-merge workflow
# auto-merges `security-fixes` only (once the required CI `tests` check passes, and
# only while every commit is Dependabot's own, signed by GitHub); version updates
# wait for a person.
#
# Commit messages follow Conventional Commits: `chore(deps): ...` for uv,
# `ci(deps): ...` for GitHub Actions (`include: scope` adds the `(deps)`).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      uv-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      gh-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
