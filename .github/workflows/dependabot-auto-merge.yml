# Enables auto-merge on every Dependabot pull request: grouped minor/patch version
# updates, single major bumps and `security-fixes`. GitHub merges it only after the
# required `tests` check passes (ruleset on main); a failing bump waits for a person.
# Never checks out or runs pull-request code.
name: dependabot-auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report failure
        if: failure()
        run: gh pr comment "$PR_URL" --body "Auto-merge could not be enabled on this Dependabot pull request; it needs a manual review."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
