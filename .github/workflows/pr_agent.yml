name: Qodo PR-Agent Reviewer

# Hardening (2026-10-18): the action is pinned to a reviewed release commit (update it
# on purpose, e.g. through a Dependabot pull request), and a comment starts the job
# only when its author is the repo owner, a member or a collaborator -- on a public
# repo any GitHub user can comment, and each comment run spends OPENAI_API_KEY.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Run PR-Agent
        uses: The-PR-Agent/pr-agent@981344be2755e303df501e18e3f60b848a188a80 # v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Set options to optimize for Python, Rust, and SQL
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: "true"
          PR_REVIEW.REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEW.REQUIRE_TESTS_REVIEW: "true"
