[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "episteme"
version = "0.1.0"
description = "Phase 0 Episteme Medical LLM data gathering and fine-tuning pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
data = [
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "pyarrow>=12.0.0",
    "requests>=2.31.0",
    "nltk>=3.8.0",
    "datasketch>=1.5.0",
    "pyeuropepmc>=0.1.0",
    "datasets>=2.14.0",
    "lxml>=5.0.0",
]
model = [
    "torch>=2.0.0",
    "transformers>=4.34.0",
    "accelerate>=0.24.0",
    "peft>=0.6.0",
    "trl>=0.7.2",
    "evaluate>=0.4.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "jsonschema>=4.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: test requires a PostgreSQL database (skipped unless TEST_PG_DSN is set)",
    "slow: test is slow (model downloads, large fixtures)",
]
