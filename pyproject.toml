[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "episteme"
version = "0.1.0"
description = "Phase 0 Episteme Medical LLM data gathering and fine-tuning pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
data = [
    "pandas>=2.0.0",
    "polars>=1.44.2",
    "pyarrow>=12.0.0",
    "requests>=2.31.0",
    "datasketch>=1.5.0",
    "datasets>=2.14.0",
    "lxml>=5.0.0",
    "psycopg[binary]>=3.3.6",
    "psycopg_pool>=3.3.3",
    "pgvector>=0.3",
    "duckdb>=1.1",
    "defusedxml>=0.7",
    "jsonschema>=4.0.0",
    "pronto>=2.7",
]
model = [
    "torch>=2.0.0",
    "transformers>=5.17.0",
    "accelerate>=0.24.0",
    "peft>=0.21.2",
    "trl>=1.14.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "episteme[data,model]",
    "pytest>=7.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "ruff>=0.16.9,<0.17",
    "bandit>=1.7.8",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: test requires a PostgreSQL database (skipped unless TEST_PG_DSN is set)",
    "slow: test is slow (model downloads, large fixtures)",
]

# uv-native dev toolchain (PEP 735). `uv run <tool>` syncs this group by
# default, so the pre-commit local hooks (`uv run ruff|bandit`) never drift
# from these pins. Mirrors [project.optional-dependencies].dev for
# plain-pip users. (Static typing / mypy deferred until the pipeline is
# functionally complete — see .pre-commit-config.yaml.)
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "ruff>=0.16.9,<0.17",
    "bandit>=1.7.8",
    "pre-commit>=4.0.0",
]
